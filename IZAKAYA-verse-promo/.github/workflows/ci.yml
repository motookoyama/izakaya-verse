name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 18
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install dependencies (frontend)
        working-directory: apps/frontend/preview-ui
        run: npm ci

      - name: Build frontend
        working-directory: apps/frontend/preview-ui
        run: npm run build

      - name: Install dependencies (bff)
        working-directory: apps/bff-express
        run: npm ci

      - name: Build bff
        working-directory: apps/bff-express
        run: npm run build

      - name: Docker build (BFF)
        working-directory: apps/bff-express
        env:
          IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/izakaya-bff:${{ github.sha }}
        run: |
          docker build -t "$IMAGE_NAME" .
          echo "IMAGE_NAME=$IMAGE_NAME" >> "$GITHUB_ENV"

      - name: Login to GitHub Container Registry
        if: env.IMAGE_NAME != ''
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        if: env.IMAGE_NAME != ''
        run: docker push "$IMAGE_NAME"

      - name: Render deploy (optional)
        if: secrets.RENDER_API_KEY
        run: |
          curl -X POST https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID }}/deploys \
            -H 'Accept: application/json' \
            -H 'Authorization: Bearer ${{ secrets.RENDER_API_KEY }}' \
            -d '{}'

      - name: Railway deploy (optional)
        if: secrets.RAILWAY_TOKEN
        run: |
          curl -X POST https://backboard.railway.app/graphql \
            -H 'Content-Type: application/json' \
            -H 'Authorization: Bearer ${{ secrets.RAILWAY_TOKEN }}' \
            -d '{"query":"mutation{deploymentDeploy(serviceId:\"${{ secrets.RAILWAY_SERVICE_ID }}\")}"}'
