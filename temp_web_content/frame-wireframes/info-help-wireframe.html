<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>Frame Map – Info/Help</title>
    <style>
      :root { font-family: sans-serif; background: #f8f8f8; color: #333; }
      body { margin: 0; padding: 32px; }
      .page { max-width: 1200px; margin: 0 auto; display: grid; gap: 16px; }
      .tabs { display: grid; grid-auto-flow: column; gap: 8px; }
      .tab { height: 36px; border-radius: 6px 6px 0 0; border: 2px solid #bbb; background: #e3e3e3; }
      .content { display: grid; gap: 24px; }
      .row { display: grid; gap: 16px; }
      .row--split { grid-template-columns: 180px 1fr; }
      .row--dual { grid-template-columns: repeat(2, 1fr); }
      .block { border: 2px solid #bbb; border-radius: 10px; min-height: 120px; position: relative; padding: 16px; }
      .block.small { min-height: 80px; }
      .block::after { position: absolute; inset: 8px auto auto 8px; font-size: 12px; color: #666; }
      .qr::after { content: '#QR/リンク'; }
      .detail::after { content: '#詳細テキスト'; }
      .timeline::after { content: '#タイムライン'; }
      .article::after { content: '#記事'; }
      .aside::after { content: '#補足'; }
    </style>
  </head>
  <body>
    <div class="page">
      <div class="tabs">
        <div class="tab"></div><div class="tab"></div><div class="tab"></div><div class="tab"></div><div class="tab"></div>
      </div>
      <div class="content">
        <div class="row row--split">
          <div class="block qr"></div>
          <div class="block detail"></div>
        </div>
        <div class="row">
          <div class="block timeline"></div>
        </div>
        <div class="row row--dual">
          <div class="block article"></div>
          <div class="block aside small"></div>
        </div>
      </div>
    </div>
  </body>
</html>
