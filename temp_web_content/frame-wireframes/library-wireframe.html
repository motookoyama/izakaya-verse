<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>Frame Map – Library</title>
    <style>
      :root { font-family: sans-serif; background: #f8f8f8; color: #333; }
      body { margin: 0; padding: 32px; }
      .page { max-width: 1200px; margin: 0 auto; display: grid; gap: 16px; }
      .tabs { display: grid; grid-auto-flow: column; gap: 8px; }
      .tab { height: 36px; border-radius: 6px 6px 0 0; border: 2px solid #bbb; background: #e3e3e3; }
      .filters { border: 2px solid #bbb; border-radius: 10px; min-height: 64px; position: relative; }
      .filters::after { content: '#フィルタ/検索バー'; position: absolute; inset: 8px auto auto 8px; font-size: 12px; color: #666; }
      .gallery { border: 2px solid #bbb; border-radius: 10px; padding: 32px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; min-height: 360px; }
      .card { border: 2px solid #bbb; border-radius: 10px; min-height: 220px; position: relative; }
      .card::after { content: '#カード'; position: absolute; inset: 8px auto auto 8px; font-size: 12px; color: #666; }
      .pagination { display: grid; grid-template-columns: 40px 1fr 40px; gap: 12px; align-items: center; justify-items: center; }
      .pager-btn, .pager-bar { border: 2px solid #bbb; border-radius: 10px; height: 40px; width: 100%; position: relative; }
      .pager-btn::after { content: '#矢印'; position: absolute; inset: 10px; font-size: 12px; color: #666; display: grid; place-items: center; }
      .pager-bar::after { content: '#ページネーション'; position: absolute; inset: 8px; font-size: 12px; color: #666; display: grid; place-items: center; }
    </style>
  </head>
  <body>
    <div class="page">
      <div class="tabs">
        <div class="tab"></div><div class="tab"></div><div class="tab"></div><div class="tab"></div><div class="tab"></div>
      </div>
      <section class="filters"></section>
      <section class="gallery">
        <div class="card"></div>
        <div class="card"></div>
        <div class="card"></div>
      </section>
      <div class="pagination">
        <div class="pager-btn"></div>
        <div class="pager-bar"></div>
        <div class="pager-btn"></div>
      </div>
    </div>
  </body>
</html>
