<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>Frame Map – Chat</title>
    <style>
      :root { font-family: sans-serif; background: #f8f8f8; color: #333; }
      body { margin: 0; padding: 32px; }
      .page { max-width: 1200px; margin: 0 auto; display: grid; gap: 16px; }
      .tabs { display: grid; grid-auto-flow: column; gap: 8px; }
      .tab { height: 36px; background: #e0e0e0; border: 2px solid #c0c0c0; border-radius: 6px 6px 0 0; }
      .canvas { display: grid; grid-template-columns: 320px 1fr; gap: 16px; min-height: 640px; }
      .sidebar { display: grid; grid-template-rows: 220px 180px 1fr; gap: 12px; }
      .slot, .panel, .sidebar-panel, .toolbar, .messages, .message, .scrollbar { border: 2px solid #c0c0c0; border-radius: 10px; background: #ffffff; position: relative; }
      .slot::after { content: '#3スロットカード'; position: absolute; inset: 8px auto auto 8px; font-size: 12px; color: #666; }
      .panel::after { content: '#インフォ'; position: absolute; inset: 8px auto auto 8px; font-size: 12px; color: #666; }
      .sidebar-panel::after { content: '#操作パネル'; position: absolute; inset: 8px auto auto 8px; font-size: 12px; color: #666; }
      .chat-area { display: grid; grid-template-rows: 96px 1fr; gap: 12px; }
      .toolbar::after { content: '#メインチャットフレーム'; position: absolute; inset: 8px auto auto 8px; font-size: 12px; color: #666; }
      .messages { display: grid; grid-template-columns: 1fr 36px; gap: 12px; padding: 16px; }
      .message-stack { display: grid; gap: 16px; }
      .message { height: 96px; }
      .scrollbar { background: linear-gradient(180deg, #dedede, #f7f7f7); }
      .scrollbar::after { content: ''; position: absolute; left: 50%; top: 20%; transform: translateX(-50%); width: 12px; height: 120px; border-radius: 12px; background: rgba(0,0,0,0.1); }
    </style>
  </head>
  <body>
    <div class="page">
      <div class="tabs">
        <div class="tab"></div><div class="tab"></div><div class="tab"></div><div class="tab"></div><div class="tab"></div>
      </div>
      <div class="canvas">
        <aside class="sidebar">
          <div class="slot"></div>
          <div class="panel"></div>
          <div class="sidebar-panel"></div>
        </aside>
        <section class="chat-area">
          <div class="toolbar"></div>
          <div class="messages">
            <div class="message-stack">
              <div class="message"></div>
              <div class="message"></div>
              <div class="message"></div>
            </div>
            <div class="scrollbar"></div>
          </div>
        </section>
      </div>
    </div>
  </body>
</html>
