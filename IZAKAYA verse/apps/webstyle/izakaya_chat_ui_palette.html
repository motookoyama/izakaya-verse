<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>IZAKAYA Chat UI — palette applied</title>
<style>
:root{
  --bg:#190c18;
  --panel:#d93851;
  --surface:#db435b;
  --line:#e16377;
  --fg:#f5f7fb;
  --muted:#aeb6c9;
  --brand:#e87b25;
  --brand-2:#58cff5;
  --accent:#190c18;
  --radius:16px; --space:14px; --shadow:0 14px 40px rgba(0,0,0,.35);
}
*{box-sizing:border-box} html,body{height:100%}
body{margin:0;background:radial-gradient(1200px 600px at 20% 0%, #10182b 0, var(--bg) 50%, #070a12 100%);color:var(--fg);font:16px/1.55 system-ui,-apple-system,'Segoe UI',Roboto,'Noto Sans JP',sans-serif;}
a{color:inherit;text-decoration:none}
.app{display:grid;grid-template-rows:auto 1fr auto;min-height:100vh}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;background:linear-gradient(180deg,var(--panel),#0f172a);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font-weight:800}
.badge{font-size:12px;padding:4px 10px;border-radius:999px;color:#0b0f14;background:linear-gradient(90deg,var(--brand),var(--brand-2));font-weight:800}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tab{padding:8px 12px;border-radius:12px;background:#111a2f;color:#cbd2e1;border:1px solid var(--line)}
.main{display:grid;grid-template-columns:280px 1fr;gap:16px;padding:16px}
@media(max-width:960px){.main{grid-template-columns:1fr}}
.sidebar{background:linear-gradient(180deg, #120916, var(--bg));border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow)}
.panel-title{font-size:12px;color:var(--brand-2);letter-spacing:.25em;text-transform:uppercase;margin-bottom:10px}
.card{background:linear-gradient(180deg,var(--surface),#0a0f1b);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.tag{font-size:12px;padding:6px 10px;border:1px solid #263257;border-radius:999px;background:#0d1527;color:#cbd2e1}
.input,.select,.textarea{width:100%;padding:12px 14px;border-radius:12px;border:1px solid #273356;background:#0d1527;color:var(--fg)}
.chat-wrap{display:grid;grid-template-rows:auto 1fr auto;gap:12px}
.chat-header{display:flex;align-items:center;justify-content:space-between}
.chat-title{font-size:14px;color:var(--brand-2);letter-spacing:.25em;text-transform:uppercase}
.msgs{background:#0a0f1b;border:1px solid var(--line);border-radius:14px;padding:14px;overflow:auto;height:56vh}
.msg{max-width:78%;padding:12px 14px;border-radius:14px;margin:6px 0}
.bot{background:rgba(88,207,245,0.12);border:1px solid rgba(88,207,245,.35)}
.me{background:rgba(232,123,37,0.12);border:1px solid rgba(232,123,37,.35);margin-left:auto}
.composer{display:grid;grid-template-columns:1fr auto auto;gap:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;padding:12px 16px;border-radius:12px;border:1px solid #303a60;background:#121a2d;color:var(--fg);font-weight:700;letter-spacing:.2px}
.btn-ghost{background:transparent;border:1px dashed #2a375e;color:#cbd2e1}
.btn-primary{background:linear-gradient(90deg,var(--brand),var(--brand-2));color:#0b0f14;border-color:transparent}
.footer{padding:16px;text-align:center;color:var(--muted);border-top:1px solid var(--line);background:var(--bg)}
</style>
</head>
<body>
<div class="app">
<header class="topbar">
  <div class="brand"><span class="badge">IZAKAYA</span> <span>Chat UI</span></div>
  <nav class="tabs">
    <span class="tab">Chat</span><span class="tab">MetaCap</span><span class="tab">Library</span><span class="tab">QR</span>
  </nav>
</header>
<main class="main">
  <aside class="sidebar">
    <div class="panel-title">V2 CARD</div>
    <div class="card" style="margin-bottom:12px">
      <div class="row"><span class="tag">icon 🃏</span><span class="tag">id: v2-001</span></div>
      <div style="height:10px"></div>
      <label class="panel-title" style="margin:0">name</label>
      <input class="input" placeholder="Dr. Orb"/>
      <div style="height:8px"></div>
      <label class="panel-title" style="margin:0">first_mes</label>
      <textarea class="textarea" rows="4">こんにちは、私は…</textarea>
    </div>
    <div class="panel-title"># パネル1</div>
    <div class="card" style="margin-bottom:12px">
      <div class="row"><span class="tag">status: draft</span><span class="tag">lang: ja</span></div>
      <div style="height:10px"></div>
      <button class="btn btn-primary" style="width:100%">保存</button>
    </div>
    <div class="panel-title"># パネル2</div>
    <div class="card"><div class="row"><span class="tag">filter</span><span class="tag">tags</span></div><div style="height:10px"></div><button class="btn" style="width:100%">共有</button></div>
  </aside>
  <section class="chat-wrap">
    <div class="chat-header">
      <div class="chat-title">IZAKAYA / CHAT</div>
      <div class="row"><button class="btn">下書き</button><button class="btn btn-ghost">履歴</button></div>
    </div>
    <div class="msgs">
      <div class="msg bot">こんにちは、何を作りますか？</div>
      <div class="msg me">MetaCapture のUI雛形を確認したい。</div>
      <div class="msg bot">右のメニューから「MetaCap」を開いてください。</div>
    </div>
    <div class="composer"><input class="input" placeholder="メッセージを入力…"/><button class="btn">添付</button><button class="btn btn-primary">送信</button></div>
  </section>
</main>
<footer class="footer">© 2025 IZAKAYA Verse — Chat UI mock (palette-applied)</footer>
</div>
</body>
</html>
