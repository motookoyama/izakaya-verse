<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>IZAKAYA Chat UI — palette applied</title>
  <style>
    /* ====== Palette from provided image ====== */
    :root{
      --bg:#14121c;           /* dark violet background */
      --panel:#1e1a2d;        /* sidebar panel */
      --surface:#211f33;      /* cards */
      --line:#3a3454;         /* borders */
      --fg:#f4f1ff;           /* text */
      --muted:#a79ebd;        /* secondary text */
      --brand:#7c5bff;        /* primary violet */
      --brand-2:#ff6bb5;      /* secondary accent (pink) */
      --accent:#ffd86b;       /* CTA accent (yellow) */
      --radius:16px;
      --space:14px;
      --shadow:0 14px 40px rgba(0,0,0,.4);
    }

    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      background: radial-gradient(1200px 600px at 20% 0%,#1e1a2d 0,#14121c 50%,#0d0b12 100%);
      color:var(--fg);
      font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans JP",sans-serif;
    }
    a{color:inherit;text-decoration:none}

    .app{display:grid; grid-template-rows:auto 1fr auto; min-height:100vh}
    .topbar{display:flex; align-items:center; justify-content:space-between; padding:10px 16px; background:linear-gradient(180deg,#2c2640,#1e1a2d); border-bottom:1px solid var(--line)}
    .brand{display:flex; align-items:center; gap:10px; font-weight:800}
    .badge{font-size:12px; padding:4px 10px; border-radius:999px; color:#14121c; background:linear-gradient(90deg,var(--brand),var(--brand-2)); font-weight:800}
    .tabs{display:flex; gap:8px; flex-wrap:wrap}
    .tab{padding:8px 12px; border-radius:12px; background:#2a2540; color:#cfc6e9; border:1px solid var(--line)}

    .main{display:grid; grid-template-columns:280px 1fr; gap:16px; padding:16px}
    @media(max-width:960px){ .main{grid-template-columns:1fr} }

    .sidebar{background:linear-gradient(180deg,#201b33,#19152a); border:1px solid var(--line); border-radius:var(--radius); padding:16px; box-shadow:var(--shadow)}
    .panel-title{font-size:12px; color:var(--brand-2); letter-spacing:.25em; text-transform:uppercase; margin-bottom:10px}
    .card{background:linear-gradient(180deg,#211f33,#19152a); border:1px solid var(--line); border-radius:var(--radius); padding:16px; box-shadow:var(--shadow)}
    .row{display:flex; gap:10px; flex-wrap:wrap}
    .tag{font-size:12px; padding:6px 10px; border:1px solid #3a3454; border-radius:999px; background:#2a2440; color:#e2dcf9}
    .input, .select, .textarea{width:100%; padding:12px 14px; border-radius:12px; border:1px solid #3a3454; background:#2a2440; color:var(--fg)}

    .chat-wrap{display:grid; grid-template-rows:auto 1fr auto; gap:12px}
    .chat-header{display:flex; align-items:center; justify-content:space-between}
    .chat-title{font-size:14px; color:var(--brand-2); letter-spacing:.25em; text-transform:uppercase}
    .msgs{background:#19152a; border:1px solid var(--line); border-radius:14px; padding:14px; overflow:auto; height:56vh}
    .msg{max-width:78%; padding:12px 14px; border-radius:14px; margin:6px 0}
    .bot{background:#2a2440}
    .me{background:#3a3255; margin-left:auto}

    .composer{display:grid; grid-template-columns:1fr auto auto; gap:10px}

    .btn{display:inline-flex; align-items:center; justify-content:center; gap:10px; padding:12px 16px; border-radius:12px; border:1px solid #303a60; background:#2a2540; color:var(--fg); font-weight:700; letter-spacing:.2px}
    .btn-ghost{background:transparent; border:1px dashed #3a3454; color:#cfc6e9}
    .btn-primary{background:linear-gradient(90deg,var(--brand),var(--brand-2)); color:#14121c; border-color:transparent}

    .footer{padding:16px; text-align:center; color:var(--muted); border-top:1px solid var(--line); background:#14121c}
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand"><span class="badge">IZAKAYA</span> <span>Chat UI</span></div>
      <nav class="tabs">
        <span class="tab">Chat</span>
        <span class="tab">MetaCap</span>
        <span class="tab">Library</span>
        <span class="tab">QR</span>
      </nav>
    </header>

    <main class="main">
      <aside class="sidebar">
        <div class="panel-title">V2 CARD</div>
        <div class="card" style="margin-bottom:12px">
          <div class="row">
            <span class="tag">icon 🃏</span>
            <span class="tag">id: v2-001</span>
          </div>
          <div style="height:10px"></div>
          <label class="panel-title" style="margin:0">name</label>
          <input class="input" placeholder="Dr. Orb" />
          <div style="height:8px"></div>
          <label class="panel-title" style="margin:0">first_mes</label>
          <textarea class="textarea" rows="4">こんにちは、私は…</textarea>
        </div>

        <div class="panel-title"># パネル1</div>
        <div class="card" style="margin-bottom:12px">
          <div class="row">
            <span class="tag">status: draft</span>
            <span class="tag">lang: ja</span>
          </div>
          <div style="height:10px"></div>
          <button class="btn btn-primary" style="width:100%">保存</button>
        </div>

        <div class="panel-title"># パネル2</div>
        <div class="card">
          <div class="row">
            <span class="tag">filter</span>
            <span class="tag">tags</span>
          </div>
          <div style="height:10px"></div>
          <button class="btn" style="width:100%">共有</button>
        </div>
      </aside>

      <section class="chat-wrap">
        <div class="chat-header">
          <div class="chat-title">IZAKAYA / CHAT</div>
          <div class="row">
            <button class="btn">下書き</button>
            <button class="btn btn-ghost">履歴</button>
          </div>
        </div>

        <div class="msgs">
          <div class="msg bot">こんにちは、何を作りますか？</div>
          <div class="msg me">MetaCapture のUI雛形を確認したい。</div>
          <div class="msg bot">右のメニューから「MetaCap」を開いてください。</div>
        </div>

        <div class="composer">
          <input class="input" placeholder="メッセージを入力…" />
          <button class="btn">添付</button>
          <button class="btn btn-primary">送信</button>
        </div>
      </section>
    </main>

    <footer class="footer">© 2025 IZAKAYA Verse — Chat UI mock (front-only)</footer>
  </div>
</body>
</html>
